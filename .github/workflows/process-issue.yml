name: Process Drive link on Issue opened
on:
  issues:
    types: [opened]

permissions:
  contents: write    # để commit outputs vào repo (docs/)
  issues: write      # để comment lên issue

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with write permissions)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy scikit-learn matplotlib gdown

      - name: Save issue context to env
        run: |
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
          echo "ISSUE_BODY<<'EOF'" >> $GITHUB_ENV
          echo "${{ github.event.issue.body }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run processing script
        id: runproc
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python github_actions/process_issue.py

      - name: Commit results to docs/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results || true
          git commit -m "Add/Update results for issue #${{ github.event.issue.number }}" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed"

      - name: Comment on issue with result links
        if: always()
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          BASE="https://$OWNER.github.io/$REPO"
          RESULT_PATH="results/issue-${ISSUE}"
          VIS_URL="$BASE/$RESULT_PATH/visualize.png"
          ZIP_URL="$BASE/$RESULT_PATH/cleaned_images.zip"
          BODY_COMMENT="✅ Processing complete (or attempted).\\n\\nVisualize: $VIS_URL\\nCleaned images: $ZIP_URL"
          curl -s -S -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -X POST \
            -d "{\"body\": \"$BODY_COMMENT\"}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE}/comments"
